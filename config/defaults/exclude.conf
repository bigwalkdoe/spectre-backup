# spectre-backup - Default exclude patterns (shared across distros/roles)
# Patterns are matched against the stored path, so do NOT add a leading slash
# unless you intend to anchor to the repository root.

# Build artifacts and dependency caches
node_modules
.venv
venv
__pycache__
*.pyc
target
dist
build
.cache
Cache
.trash
Trash
*.iso

# Disk images and VMs
*.qcow2
*.vdi
*.vmdk
*.ova
*.img
Steam
snap
VM Images
VMs

# Language-specific caches
go/pkg
.cargo/registry
.cargo/git
.rustup

# Container storage (derived; containers are backed up via config, not images)
/containers/storage/overlay
/containers/storage/volumes
/home/*/.local/share/containers

# --- Derived and re-downloadable content (measured in real snapshots) ---

# KDE's file-search index. Rebuilt by baloo on demand.
baloo

# Chrome's on-device AI model (~4 GiB). Chrome re-downloads it.
OptGuideOnDeviceModel

# VS Code's downloaded-extension cache (~0.9 GiB). Reinstalls from marketplace.
.config/Code/CachedExtensionVSIXs

# opencode's own state: ~4 GiB SQLite holding sessions and messages, plus a
# `credential` table. Excluded because it is tool state rather than user data,
# and replicating a credential table into every backup is not something to do
# by accident.
.local/share/opencode

# Core dumps: core.<pid> only (narrower than core.* which matches source files).
core.[0-9]*
