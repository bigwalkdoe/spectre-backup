# fedora-back-up - Offsite (remote) scope
# Small, irreplaceable data only. Sized to fit a 15 GiB Google Drive quota.
# Anything omitted here is still covered locally by include.conf.

# --- Credentials and identity: unrecoverable if lost, trivially small ---
~/.ssh
~/.gnupg

# --- Shell and git configuration ---
~/.bashrc
~/.bash_profile
~/.zshrc
~/.gitconfig
~/.gitignore_global

# --- Editor and desktop configuration ---
~/.config/systemd
~/.config/nvim
~/.config/Code/User

# Deliberately NOT included: ~/.config/fedora-back-up
# That directory holds the restic password, which is the key to BOTH repositories.
# Including it means anyone with Drive access can read the local backups too.
# Keep the password in a password manager instead.
