# spectre-backup - Default included paths (shared across distros/roles)
# Each existing path here is backed up. Missing paths are skipped with a warning.
# Deployed copies live at ~/.config/spectre-backup/include.conf.
# Edit the deployed copy for host-local changes, or edit here and redeploy.

# Shell / dotfiles
~/.bashrc
~/.bash_profile
~/.zshrc
~/.gitconfig
~/.gitignore_global
~/.ssh
~/.gnupg

# Config home
~/.config

# Local state (small, valuable parts only; large derived caches excluded elsewhere)
~/.local/share

# Git mirrors (history without working trees) - refreshed by git-mirror.sh
~/.git-mirror

# Archives and resources
~/archives
~/resources
~/downloads
~/Screenshots

# System-wide (may be large; uncomment deliberately)
# /etc
# /opt
