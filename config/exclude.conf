# --- Derived and re-downloadable content -------------------------------
#
# Every entry below was measured in an actual snapshot with
# `restic ls --long latest`, not inferred from disk usage. Together these are
# ~10.7 GiB of the local snapshot, none of it irreplaceable.

# KDE's file-search index. Rebuilt by baloo on demand; it is derived from files
# that are themselves backed up, so restoring it achieves nothing.
baloo

# Chrome's on-device AI model, ~4.0 GiB across weights.bin and cache.bin.
# Chrome re-downloads it when the feature is used.
OptGuideOnDeviceModel

# VS Code's downloaded-extension cache (~0.9 GiB). The extensions themselves
# reinstall from the marketplace.
.config/Code/CachedExtensionVSIXs

# opencode's own state: ~4.4 GiB SQLite holding sessions and messages, plus a
# `credential` table. Excluded because it is tool state rather than user data,
# because it is the fastest-growing thing in the snapshot by a wide margin, and
# because replicating a credential table into every backup is not something to
# do by accident. The cost is losing session history, which is recoverable in
# the sense that it is not data anyone else needs.
.local/share/opencode

# Core dumps, named core.<pid> by the kernel. Deliberately narrower than
# core.*: 199 real source files here match that, including core.py, core.h and
# core.toml, and excluding those would be silent data loss. core.[0-9]* matches
# only the dumps.
core.[0-9]*
