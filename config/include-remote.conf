# fedora-back-up - Offsite (remote) scope
#
# Why this file exists
# --------------------
# The offsite target is Google Drive with a 15 GiB quota. The local repository
# is ~52 GiB, so sending the full scope offsite could never have worked: it was
# not a retry or tuning problem but a capacity one. The uploads failed with
# HTTP 500 / rateLimitExceeded while the remote repository held zero snapshots,
# which meant the offsite leg had been dead for weeks while the local copy grew
# without a second copy existing anywhere.
#
# So the two repositories no longer carry the same paths. The local repository
# keeps the full include.conf scope; this file scopes the offsite leg down to
# what cannot be regenerated. Anything omitted here is still covered locally --
# this list is about what survives losing the disk, not about what gets backed
# up at all.
#
# Sizing: ~180 MiB of source. restic deduplicates across snapshots, so a
# fortnight of these lands well inside the 15 GiB quota with room to spare. That
# headroom is the point: the previous scope could not fit at all.
#
# Deliberately excluded, and why:
#   /home/deon/.config/google-chrome   8.7G  browser profile, re-login
#   /home/deon/.config/Code            2.1G  mostly extension/state, not settings
#   /home/deon/.config/Cursor          956M  same
#   /home/deon/.local/share            13G   Steam, containers, regenerable data
#   /home/deon/dev                     23G   every repo is already on GitHub
#   /home/deon/archives, downloads, Screenshots   bulk, recoverable
#
# If the quota is ever raised, or a target with real capacity (B2/S3) is added,
# delete this file: the script falls back to the full local scope automatically.

# --- Credentials and identity: unrecoverable if lost, trivially small ---
/home/deon/.ssh
/home/deon/.gnupg

# --- Shell and git configuration ---
/home/deon/.bashrc
/home/deon/.bash_profile
/home/deon/.zshrc
/home/deon/.gitconfig
/home/deon/.gitignore_global

# --- Editor and desktop configuration ---
/home/deon/.config/systemd
/home/deon/.config/nvim
/home/deon/.config/kde-macos
/home/deon/.config/Code/User

# --- Host maintenance tooling, which is the code that manages this machine ---
/home/deon/.config/spectre

# Deliberately NOT included: /home/deon/.config/fedora-back-up
#
# That directory holds the restic password, which is the key to BOTH
# repositories. Including it means anyone with Drive access can read the local
# backups too. The cost of excluding it is that recovering after losing both the
# disk and the password requires restoring the password from somewhere else --
# keep it in a password manager, which is where it belongs anyway.
