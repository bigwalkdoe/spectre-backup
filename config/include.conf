# fedora-back-up - Included Paths
#
# Each existing path here is backed up. A missing one is skipped with a warning
# rather than failing the run, so a retired directory left in this list was
# silently a no-op until someone read the logs.
#
# /home/deon/scripts was removed when the maintenance suite superseded it as the
# canonical host-maintenance code. The fork is archived under
# /home/deon/archives/superseded-fork/, which is already covered by the
# /home/deon/archives line below, so nothing is lost by dropping it here.
#
# Deployed copies live at ~/.config/fedora-back-up/include.conf. Edit this file
# and redeploy, or edit the deployed copy directly for a host-local change.
/home/deon/.bashrc
/home/deon/.gitconfig
/home/deon/.ssh
/home/deon/.gnupg
/home/deon/.config
/home/deon/.local/share
# /home/deon/dev was replaced by /home/deon/.git-mirror.
#
# exclude.conf already drops node_modules, .venv, dist and build, so most of
# /home/deon/dev never reached the backup -- but the working trees were still
# copied to protect history that the .git directories already contained.
# Working trees re-clone; commits do not, and repos here have had commits that
# were on no remote. scripts/git-mirror.sh refreshes /home/deon/.git-mirror
# before each backup, so history is protected without the worktrees.
#
# Uncommitted and untracked working-tree files are therefore not covered. Keep
# anything unrecoverable in a commit. Local scope only: include-remote.conf
# deliberately omits this, being sized against a 15 GiB Drive quota.
/home/deon/.git-mirror
/home/deon/archives
/home/deon/resources
# Renamed from Downloads on this host. The old spelling was silently skipped --
# a missing path is warned about and dropped, not fatal -- so the directory was
# quietly not being backed up.
/home/deon/downloads
/home/deon/Screenshots

# Intended in the template but absent from the deployed copy on this host, so
# /etc and /opt have never actually been backed up. Flagged rather than removed:
# adding them roughly triples the snapshot size, which is a decision to make
# deliberately, not a cleanup to make silently. Comment out to skip.
/etc
/opt