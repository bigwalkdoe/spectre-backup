# fedora-back-up - Included Paths
#
# Each existing path here is backed up. A missing one is skipped with a warning
# rather than failing the run, so a retired directory left in this list was
# silently a no-op until someone read the logs.
#
# /home/deon/scripts was removed when the maintenance suite superseded it as the
# canonical host-maintenance code. The fork is archived under
# /home/deon/archives/superseded-fork/, which is already covered by the
# /home/deon/archives line below, so nothing is lost by dropping it here.
#
# Deployed copies live at ~/.config/fedora-back-up/include.conf. Edit this file
# and redeploy, or edit the deployed copy directly for a host-local change.
/home/deon/.bashrc
/home/deon/.gitconfig
/home/deon/.ssh
/home/deon/.gnupg
/home/deon/.config
/home/deon/.local/share
/home/deon/dev
/home/deon/archives
/home/deon/resources
/home/deon/Downloads
/home/deon/Screenshots

# Intended in the template but absent from the deployed copy on this host, so
# /etc and /opt have never actually been backed up. Flagged rather than removed:
# adding them roughly triples the snapshot size, which is a decision to make
# deliberately, not a cleanup to make silently. Comment out to skip.
/etc
/opt