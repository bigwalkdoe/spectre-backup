# fedora-back-up - Server excludes (Ubuntu)
# Inherits defaults/exclude.conf. Server-specific additions below.

# Runtime and ephemeral data
/var/run
/var/lock
/var/tmp
/dev
/proc
/sys

# Package manager caches
/var/cache/apt
/var/lib/apt/lists

# Container runtime storage (images are derived; configs are backed up above)
/var/lib/docker/overlay2
/var/lib/docker/volumes

# Log files (rotate, don't back up)
/var/log

# Core dumps
core.[0-9]*
