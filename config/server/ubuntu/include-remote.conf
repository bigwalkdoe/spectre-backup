# fedora-back-up - Server offsite scope (Ubuntu)
# Small, irreplaceable system data for Google Drive (15 GiB quota).

# SSH host keys and credentials
/etc/ssh
/root/.ssh
/root/.gnupg

# Systemd custom units
/etc/systemd/system

# Root's gitconfig and shell config
/root/.gitconfig
/root/.bashrc
/root/.bash_profile

# Git mirror (history without working trees)
/root/.git-mirror
