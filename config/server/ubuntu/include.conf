# fedora-back-up - Server scope (Ubuntu)
# System-wide backup for an Ubuntu server. No desktop assumptions.

# System configuration
/etc

# Optional add-on software
/opt

# Locally installed software and scripts
/usr/local

# Root's home (dotfiles, SSH keys, etc.)
/root

# Web roots (uncomment if you run a web server)
# /var/www

# Database data directories (uncomment if databases store data here directly;
# otherwise rely on pg_dumpall/mysql-dump dumps instead)
# /var/lib/postgresql
# /var/lib/mysql

# Container configs and data (Docker on Ubuntu)
/var/lib/docker
/etc/docker

# Systemd unit files (custom)
/etc/systemd/system

# Root's config and state
/root/.config
/root/.local/share

# Git mirrors under root
/root/.git-mirror
