# fedora-back-up - Workstation scope (Fedora)
# Personal files, dotfiles, and user-level data. System paths (/etc, /opt)
# are listed at the bottom; uncomment deliberately.

# Shell / dotfiles
~/.bashrc
~/.bash_profile
~/.zshrc
~/.gitconfig
~/.gitignore_global
~/.ssh
~/.gnupg

# Config home (includes Podman quadlets, systemd user units, app settings)
~/.config

# Local state (valuable subset; large derived caches excluded by exclude.conf)
~/.local/share

# Git mirrors - history without working trees, refreshed by git-mirror.sh
~/.git-mirror

# Archives and resources
~/archives
~/resources
~/downloads
~/Screenshots

# System-wide (uncomment deliberately - triples snapshot size)
# /etc
# /opt
