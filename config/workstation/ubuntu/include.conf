# fedora-back-up - Workstation scope (Ubuntu)
# Personal files, dotfiles, and user-level data.

# Shell / dotfiles
~/.bashrc
~/.bash_profile
~/.zshrc
~/.gitconfig
~/.gitignore_global
~/.ssh
~/.gnupg

# Config home (includes Docker config, systemd user units, app settings)
~/.config

# Local state (valuable subset; large derived caches excluded by exclude.conf)
~/.local/share

# Git mirrors - history without working trees, refreshed by git-mirror.sh
~/.git-mirror

# Archives and resources
~/archives
~/resources
~/downloads
~/Screenshots

# System-wide (uncomment deliberately)
# /etc
# /opt
